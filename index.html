<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👋👋👋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: #0f172a;
            padding: 16px;
        }
        img {
            max-width: 90vw;
            max-height: 90vh;
            max-height: 90dvh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        /* Penyesuaian khusus layar HP / Mobile */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            img {
                width: 100%;
                max-width: 100%;
                max-height: 85dvh;
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>
    <img src="./assets/images/nakal.png" alt="Gambar">
</body>
</html>
